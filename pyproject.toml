[project]
name = "beamerpkg"
version = "0.2.2"
description = "Portable Beamer/PDF presentation bundles with external media assets"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Uli Kerzel" }]
dependencies = ["pypdf>=5.0,<7.0"]

[project.scripts]
beamerpkg = "beamerpkg.cli:main"

[tool.poetry]
packages = [{ include = "beamerpkg", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
ruff = "^0.12.0"
mypy = "^1.11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
xfail_strict = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
